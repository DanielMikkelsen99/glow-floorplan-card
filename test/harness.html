<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;padding:16px;font-family:Roboto,Arial,sans-serif;background:var(--bg,#f2f4f8)} .row{display:flex;gap:16px;align-items:flex-start}
.col{width:400px}</style>
<script>
// Minimal stand-ins for HA's built-in elements.
customElements.define('ha-card', class extends HTMLElement{connectedCallback(){this.style.display='block';this.style.borderRadius='12px';this.style.background='var(--ha-card-background,#fff)';this.style.boxShadow='0 2px 6px rgba(0,0,0,.15)'}});
const GLYPH={'mdi:ceiling-light':'💡','mdi:lamp':'🛋','mdi:floor-lamp':'🪔','mdi:airplane':'✈','mdi:outdoor-lamp':'🏮','mdi:robot-vacuum':'🤖','mdi:robot-mower':'🚜','mdi:string-lights':'✨'};
customElements.define('ha-icon', class extends HTMLElement{static get observedAttributes(){return['icon']} attributeChangedCallback(){this.render()} connectedCallback(){this.render()} render(){const g=GLYPH[this.getAttribute('icon')]||'●';this.innerHTML=`<span style="display:inline-block;width:26px;height:26px;border-radius:50%;background:currentColor;opacity:.95;font-size:15px;line-height:26px;text-align:center">${g}</span>`}});
</script>
<script src="../glow-floorplan-card.js"></script>
</head><body><div class="row" id="row"></div></body></html>
