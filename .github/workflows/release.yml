name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version in file matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "const VERSION = \"$TAG\"" glow-floorplan-card.js || { echo "VERSION in glow-floorplan-card.js does not match tag $GITHUB_REF_NAME"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: glow-floorplan-card.js
          generate_release_notes: true
